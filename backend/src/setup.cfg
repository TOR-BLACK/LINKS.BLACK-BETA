# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3.7/distutils/configfile.html

[tool:pytest]
# pytest configuration:
# https://docs.pytest.org/en/stable/customize.html

# pytest-django configuration:
# https://pytest-django.readthedocs.io/en/latest/
DJANGO_SETTINGS_MODULE = core.settings.test_settings

# Timeout for tests, so they can not take longer
# than this amount of seconds.
# You should adjust this value to be as low as possible.
# Configuration:
# https://pypi.org/project/pytest-timeout/
# timeout = 20

# Marks
markers = slow: mark test as slow.

# Strict `@xfail` by default:
xfail_strict = true

# Directories that are not visited by pytest collector:
norecursedirs = .git __pycache__ commands migrations

addopts =
  --strict-markers
  --strict-config
  --reuse-db
  # Output:
  --tb=short
  # Parallelism:
;  # -n auto
;  # --boxed
  # Coverage:
;  --cov=accounts
;  --cov=tests
;  --cov-branch
;  --cov-report=term-missing:skip-covered
;  --cov-report=html
;  --cov-report=xml
;  --cov-fail-under=0

filterwarnings =
  ignore::pytest.PytestCollectionWarning:
  ignore::RuntimeWarning
  # ignore::django.utils.deprecation.DeprecationWarning
  ignore::DeprecationWarning
  # Some dependencies have deprecation warnings, we don't want to see them,
  # but, we want to list them here:
  ignore::DeprecationWarning:kombu:
  ignore::DeprecationWarning:django:
  ignore::DeprecationWarning:eventlet:
